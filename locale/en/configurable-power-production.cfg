[mod-setting-description]
configurable-power-production-solar-panel-power-multiplier=Multiplies the power production of solar panels. 0 disables solar panels, values above 1 make them stronger.
configurable-power-production-solar-panel-recipe-multiplier=Multiplies the crafting cost of the solar panel recipe. Never reduces a recipe cost below 1.
configurable-power-production-solar-panel-weight-multiplier=Multiplies the item weight of the solar panel. Heavier items take more rocket lift capacity.
configurable-power-production-accumulator-power-multiplier=Multiplies the capacity and charge/discharge rates of accumulators.
configurable-power-production-accumulator-recipe-multiplier=Multiplies the crafting cost of the accumulator recipe. Never reduces a recipe cost below 1.
configurable-power-production-accumulator-weight-multiplier=Multiplies the item weight of the accumulator. Heavier items take more rocket lift capacity.
configurable-power-production-nuclear-reactor-power-multiplier=Multiplies the heat output of nuclear reactors.
configurable-power-production-nuclear-reactor-recipe-multiplier=Multiplies the crafting cost of the nuclear reactor recipe. Never reduces a recipe cost below 1.
configurable-power-production-nuclear-reactor-weight-multiplier=Multiplies the item weight of the nuclear reactor. Heavier items take more rocket lift capacity.
configurable-power-production-nuclear-reactor-radius-multiplier=Multiplies the radius in which the nuclear reactor radiates heat to its surroundings, thawing frozen terrain and entities. Reactors have no heating radius by default, so any value above 1 enables ambient heating.
configurable-power-production-nuclear-reactor-neighbor-bonus=Toggle the neighbour bonus of nuclear reactors (extra heat output per orthogonally adjacent reactor). On by default, matching vanilla.
configurable-power-production-heating-tower-power-multiplier=Multiplies the heat output of heating towers.
configurable-power-production-heating-tower-recipe-multiplier=Multiplies the crafting cost of the heating tower recipe. Never reduces a recipe cost below 1.
configurable-power-production-heating-tower-weight-multiplier=Multiplies the item weight of the heating tower. Heavier items take more rocket lift capacity.
configurable-power-production-heating-tower-radius-multiplier=Multiplies the radius in which the heating tower radiates heat to its surroundings, thawing frozen terrain and entities. Heating towers have no heating radius by default, so any value above 1 enables ambient heating.
configurable-power-production-heating-tower-neighbor-bonus=Toggle a neighbour bonus for heating towers (extra heat output per orthogonally adjacent heating tower). Off by default, matching vanilla.
configurable-power-production-heat-pipe-power-multiplier=Multiplies the heat transfer rate and heat capacity of heat pipes.
configurable-power-production-heat-pipe-radius-multiplier=Multiplies the radius in which heat pipes heat their surroundings.
configurable-power-production-heat-pipe-recipe-multiplier=Multiplies the crafting cost of the heat pipe recipe. Never reduces a recipe cost below 1.
configurable-power-production-heat-pipe-weight-multiplier=Multiplies the item weight of the heat pipe. Heavier items take more rocket lift capacity.
configurable-power-production-boiler-power-multiplier=Multiplies the fuel consumption of coal boilers, which scales their steam output accordingly.
configurable-power-production-heat-exchanger-power-multiplier=Multiplies the fuel consumption of heat exchangers, which scales their steam output accordingly.
configurable-power-production-boiler-recipe-multiplier=Multiplies the crafting cost of the boiler recipe. Never reduces a recipe cost below 1.
configurable-power-production-heat-exchanger-recipe-multiplier=Multiplies the crafting cost of the heat exchanger recipe. Never reduces a recipe cost below 1.
configurable-power-production-boiler-weight-multiplier=Multiplies the item weight of the boiler. Heavier items take more rocket lift capacity.
configurable-power-production-heat-exchanger-weight-multiplier=Multiplies the item weight of the heat exchanger. Heavier items take more rocket lift capacity.
configurable-power-production-steam-engine-power-multiplier=Multiplies the power output of steam engines.
configurable-power-production-steam-engine-recipe-multiplier=Multiplies the crafting cost of the steam engine recipe. Never reduces a recipe cost below 1.
configurable-power-production-steam-engine-weight-multiplier=Multiplies the item weight of the steam engine. Heavier items take more rocket lift capacity.
configurable-power-production-steam-turbine-power-multiplier=Multiplies the power output of steam turbines.
configurable-power-production-steam-turbine-recipe-multiplier=Multiplies the crafting cost of the steam turbine recipe. Never reduces a recipe cost below 1.
configurable-power-production-steam-turbine-weight-multiplier=Multiplies the item weight of the steam turbine. Heavier items take more rocket lift capacity.
configurable-power-production-fusion-reactor-power-multiplier=Multiplies the energy the fusion reactor draws to sustain its reaction.
configurable-power-production-fusion-reactor-recipe-multiplier=Multiplies the crafting cost of the fusion reactor recipe. Never reduces a recipe cost below 1.
configurable-power-production-fusion-reactor-weight-multiplier=Multiplies the item weight of the fusion reactor. Heavier items take more rocket lift capacity.
configurable-power-production-fusion-generator-power-multiplier=Multiplies the power output of fusion generators.
configurable-power-production-fusion-generator-recipe-multiplier=Multiplies the crafting cost of the fusion generator recipe. Never reduces a recipe cost below 1.
configurable-power-production-fusion-generator-weight-multiplier=Multiplies the item weight of the fusion generator. Heavier items take more rocket lift capacity.
configurable-power-production-apply-to-modded=Also apply the multipliers above to buildings added by other mods. Modded buildings get no settings of their own; they inherit the multipliers of the vanilla building they resemble (e.g. new nuclear reactors use the nuclear reactor multipliers, hot generators use the steam turbine multipliers). A colour-coded tooltip on the building shows which group it was classified into.
configurable-power-production-lightning-rod-power-multiplier=Multiplies the buffer capacity and discharge rate of lightning rods: how much strike energy can be stored and how fast it feeds the grid.
configurable-power-production-lightning-rod-recipe-multiplier=Multiplies the crafting cost of the lightning rod recipe. Never reduces a recipe cost below 1.
configurable-power-production-lightning-rod-weight-multiplier=Multiplies the item weight of the lightning rod. Heavier items take more rocket lift capacity.
configurable-power-production-lightning-rod-range-multiplier=Multiplies how far lightning is attracted from. Higher values make the lightning rod attract lightning from a larger area.
configurable-power-production-lightning-collector-power-multiplier=Multiplies the buffer capacity and discharge rate of lightning collectors: how much strike energy can be stored and how fast it feeds the grid.
configurable-power-production-lightning-collector-recipe-multiplier=Multiplies the crafting cost of the lightning collector recipe. Never reduces a recipe cost below 1.
configurable-power-production-lightning-collector-weight-multiplier=Multiplies the item weight of the lightning collector. Heavier items take more rocket lift capacity.
configurable-power-production-lightning-collector-range-multiplier=Multiplies how far lightning is attracted from. Higher values make the lightning collector attract lightning from a larger area.

